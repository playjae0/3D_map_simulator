<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
    <title>3D 지도 뷰어</title>
    <style>html,body{background:#d9e2ea;height:100%;margin:0;overflow:hidden}canvas{touch-action:none;display:block}.overlay{color:#fff;background:#00000080;border-radius:4px;font:12px/1.4 system-ui,sans-serif;position:fixed}#stats{white-space:pre;pointer-events:none;padding:6px 8px;font-family:ui-monospace,Menlo,Consolas,monospace;top:8px;left:8px}#hint{pointer-events:none;max-width:calc(100% - 32px);padding:4px 8px;bottom:30px;left:8px}#attribution{pointer-events:none;max-width:calc(100% - 28px);padding:3px 7px;font-size:11px;bottom:6px;right:6px}#panel-toggle{cursor:pointer;border:0;padding:6px 10px;font-size:13px;top:8px;right:8px}#panel{min-width:170px;padding:8px 10px;top:44px;right:8px}#panel label{justify-content:space-between;align-items:center;gap:10px;margin:4px 0;display:flex}#panel select,#panel input{font-size:13px}#panel .note{opacity:.75;margin-top:4px;font-size:11px}@media (width<=560px){#panel{top:128px}}</style>
    <script type="module" crossorigin src="./assets/index-up4VsVtO.js"></script>
  </head>
  <body>
    <div id="stats" class="overlay">불러오는 중…</div>
    <button id="panel-toggle" class="overlay" type="button">설정</button>
    <div id="panel" class="overlay" hidden>
      <label>픽셀 비율 상한
        <select name="dpr">
          <option value="1">1</option>
          <option value="1.5">1.5</option>
          <option value="2">2</option>
          <option value="3">3</option>
        </select>
      </label>
      <label>안티에일리어싱 <input type="checkbox" name="aa" /></label>
      <label>외장 패턴 <input type="checkbox" name="facade" /></label>
      <label>접지 그늘 <input type="checkbox" name="ground" /></label>
      <div class="note" id="device-dpr"></div>
    </div>
    <div id="hint" class="overlay">한 손가락·왼쪽 드래그: 이동 / 두 손가락·오른쪽 드래그: 회전</div>
    <div id="attribution" class="overlay">건물 데이터: 국토교통부 GIS건물통합정보 (공공누리 제1유형)</div>
  </body>
</html>

<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
    <title>3D 지도 뷰어</title>
    <style>html,body{background:#d9e2ea;height:100%;margin:0;overflow:hidden}canvas{touch-action:none;display:block}.overlay{color:#fff;background:#00000080;border-radius:4px;font:12px/1.4 system-ui,sans-serif;position:fixed}#stats{white-space:pre;pointer-events:none;padding:6px 8px;font-family:ui-monospace,Menlo,Consolas,monospace;top:8px;left:8px}#hint{pointer-events:none;max-width:calc(100% - 190px);padding:4px 8px;bottom:30px;left:8px}#attribution{pointer-events:none;max-width:calc(100% - 28px);padding:3px 7px;font-size:11px;bottom:6px;right:6px}#panel-toggle{cursor:pointer;border:0;padding:6px 10px;font-size:13px;top:8px;right:8px}#panel{min-width:170px;padding:8px 10px;top:44px;right:8px}#panel label{justify-content:space-between;align-items:center;gap:10px;margin:4px 0;display:flex}#panel select,#panel input{font-size:13px}#panel .note{opacity:.75;margin-top:4px;font-size:11px}@media (width<=560px){#panel{top:150px}}#minimap{cursor:crosshair;touch-action:none;background:#1d2329;border-radius:4px;position:fixed;bottom:30px;right:6px;overflow:hidden;box-shadow:0 0 0 1px #ffffff59}#minimap img,#minimap canvas{-webkit-user-select:none;user-select:none;width:100%;height:100%;position:absolute;inset:0}#minimap img{opacity:.92;pointer-events:none}#labels{pointer-events:none;transition:opacity .2s;position:fixed;inset:0;overflow:hidden}.area-label{white-space:nowrap;color:#1c232a;background:#ffffffd1;border-radius:3px;padding:2px 6px;font:600 13px/18px system-ui,sans-serif;position:absolute;top:0;left:0;box-shadow:0 1px 2px #00000040}</style>
    <script type="module" crossorigin src="./assets/index-CNuWqlU1.js"></script>
  </head>
  <body>
    <div id="stats" class="overlay">불러오는 중…</div>
    <button id="panel-toggle" class="overlay" type="button">설정</button>
    <div id="panel" class="overlay" hidden>
      <label>픽셀 비율 상한
        <select name="dpr">
          <option value="1">1</option>
          <option value="1.5">1.5</option>
          <option value="2">2</option>
          <option value="3">3</option>
        </select>
      </label>
      <label>안티에일리어싱 <input type="checkbox" name="aa" /></label>
      <label>외장 패턴 <input type="checkbox" name="facade" /></label>
      <label>접지 그늘 <input type="checkbox" name="ground" /></label>
      <div class="note" id="device-dpr"></div>
    </div>
    <div id="labels"></div>
    <div id="minimap" hidden title="누르면 그 위치로 이동"></div>
    <div id="hint" class="overlay">이동: 한 손가락·왼쪽 드래그 / 확대·축소: 두 손가락 벌리기·휠 / 회전: 두 손가락 끌기·오른쪽 드래그</div>
    <div id="attribution" class="overlay">건물 데이터: 국토교통부 GIS건물통합정보 (공공누리 제1유형)</div>
  </body>
</html>
